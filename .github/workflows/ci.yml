name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false
      - run: cargo fmt --check

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Validate hook templates and manifest versions
        shell: bash
        run: |
          set -euo pipefail
          for hook in hooks/windows/agent-bridge-grok.json hooks/unix/agent-bridge-grok.json; do
            jq -e '.hooks | length == 14' "$hook" >/dev/null
            jq -e '[.hooks[][].hooks[] | select(.env.AGENT_BRIDGE_HOOK_PROTOCOL == "5")] | length == 14' "$hook" >/dev/null
          done
          for hook in hooks/windows/agent-bridge-codex.json hooks/unix/agent-bridge-codex.json; do
            jq -e '.hooks | length == 8' "$hook" >/dev/null
          done

          node <<'NODE'
          const assert = require('node:assert');
          const fs = require('node:fs');
          const path = require('node:path');

          const cargoToml = fs.readFileSync('Cargo.toml', 'utf8');
          const versionMatch = cargoToml.match(/^\s*version\s*=\s*"([^"]+)"/m);
          assert(versionMatch, 'Missing [package] version in Cargo.toml');
          const expectedVersion = versionMatch[1];

          const plugin = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
          assert.strictEqual(plugin.name, 'agent-bridge', 'plugin.json name must be agent-bridge');

          const entryManifests = ['package.json', path.join('packages', 'agent-bridge-rs', 'package.json')];
          for (const manifestPath of entryManifests) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            assert.strictEqual(manifest.version, expectedVersion, `${manifestPath} version mismatch`);
            for (const [dep, ver] of Object.entries(manifest.optionalDependencies || {})) {
              assert.strictEqual(ver, expectedVersion, `${manifestPath} optionalDependency ${dep} mismatch`);
            }
          }

          for (const dir of ['win32-x64', 'win32-arm64', 'linux-x64', 'linux-arm64', 'darwin-x64', 'darwin-arm64']) {
            const manifestPath = path.join('packages', dir, 'package.json');
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            assert.strictEqual(manifest.version, expectedVersion, `${manifestPath} version mismatch`);
          }
          console.log(`Validated hook templates and manifests for version ${expectedVersion}`);
          NODE

  webui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
        working-directory: webui
      - run: npm test
        working-directory: webui
      - run: npm run build
        working-directory: webui
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error
          retention-days: 1

  build:
    needs:
      - format
      - validate
      - webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/agent-bridge.exe
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/agent-bridge.exe
          - platform: linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/agent-bridge
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/agent-bridge
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/agent-bridge
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/agent-bridge
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@1044a6dea927916f2c38ba5aeffbc0a847b1221a # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Verify Windows host architecture mapping
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $platform = switch ($architecture) {
            "X64" { "windows-x86_64" }
            "Arm64" { "windows-arm64" }
            default { throw "Unsupported Windows OS architecture: $architecture" }
          }
          if ($platform -ne "${{ matrix.platform }}") {
            throw "Windows host mapping selected $platform, expected ${{ matrix.platform }}"
          }
      - uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: webui-dist
          path: webui/dist
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          # Ubuntu ARM runners use ports.ubuntu.com. Prefer HTTPS, force IPv4,
          # and retry transient mirror/network failures.
          sudo sed -i \
            -e 's#http://ports.ubuntu.com/ubuntu-ports#https://ports.ubuntu.com/ubuntu-ports#g' \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/*.list \
            /etc/apt/sources.list.d/*.sources 2>/dev/null || true

          export DEBIAN_FRONTEND=noninteractive
          apt_opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::ForceIPv4=true
          )
          timeout 180 sudo apt-get "${apt_opts[@]}" update
          timeout 180 sudo apt-get "${apt_opts[@]}" install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets --all-features -- -D warnings
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Run Node launcher tests against release binary
        env:
          AGENT_BRIDGE_TEST_BINARY: ${{ matrix.binary }}
        run: node test/launcher.test.js

  cleanup:
    if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: build
    permissions:
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Delete temporary workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_ids="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[].id'
          )"
          for artifact_id in $artifact_ids; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
