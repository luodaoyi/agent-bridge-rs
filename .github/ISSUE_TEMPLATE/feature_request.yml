name: Feature request
description: Propose a bounded enhancement within agent-bridge-rs's local runtime scope
labels: [enhancement]
body:
  - type: dropdown
    id: subsystem
    attributes:
      label: Target subsystem
      options:
        - protocol-and-transport
        - worker-and-pty
        - hooks-and-installer
        - server-and-webui
        - loop-and-release
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior & acceptance criteria
      placeholder: |
        - [ ] Acceptance criterion 1
        - [ ] Acceptance criterion 2
    validations:
      required: true
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals / out of scope
      description: Explicitly state what should NOT be changed or expanded (e.g. keep local-only daemon boundary).
